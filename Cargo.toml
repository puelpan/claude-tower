[package]
name = "claude-tower"
version = "0.1.0"
edition = "2024"
description = "A control tower for Claude Code instances running in tmux"
license = "GPL-3.0-or-later"
repository = "https://github.com/puelpan/claude-tower"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
memchr = "2"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
